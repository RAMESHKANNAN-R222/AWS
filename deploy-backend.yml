name: Deploy AWS Serverless Backend Stack

on:
  push:
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-backend.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-aws-sam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Lambda Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: |
          cd infrastructure
          sam build --template-file template.yaml

      - name: SAM Deploy to AWS
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          cd infrastructure
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name taskvault-serverless-stack --capabilities CAPABILITY_IAM --resolve-s3
